<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  </head>
  <body>
    <h1>Browser Test</h1>
    <p>
      For this test to work, a fileserver must be run in the root of
      this project. Try, for example: <code>caddy file-server --location :8080</code>.
    </p>

    <div>
      <button id="create-database">Create Database</button>
      <button id="delete-database">Delete Database</button>
      <button id="list-databases">List Databases</button>
      <button id="list-stores">List Stores</button>
      <button>Do nothing</button>
    </div>
    <div>
      <h1>Todos</h1>
      <form id="todo-form">
        <input name="todo-input" type="text">
        <button>Add Todo</button>
      </form>
      <button id="log-todos">Log Todos</button>
      <ul id="todos">
      </ul>
    </div>
  </body>
  <script type="module">
    import {
      responsePromise,
      Database,
    } from '/src/index.js';

    const DBNAME = 'test-db';
    let db = undefined;

    // Button Handler Functions

    function createDatabase() {
      console.log('create database');

      db = new Database(DBNAME, {
        1: (db) => {
          console.log("Upgrading to version 1");
          const store = db.createObjectStore("todo", { autoIncrement: true });
          const idx = store.createIndex("task", "task", { unique: false });
        },
        2: (db) => {
          console.log("Upgrading to version 2");
          const store = db.createObjectStore("done", { autoIncrement: true });
          const idx = store.createIndex("task", "task", { unique: false });
        }
      })
    }
    buttonize("#create-database", createDatabase);


    function deleteDatabase() {
      console.log('delete database');

      responsePromise(window.indexedDB.deleteDatabase(DBNAME))
        .then(res => console.log(res));
    }
    buttonize("#delete-database", deleteDatabase);


    function listDatabases() {
      console.log('list databases');

      window.indexedDB.databases()
        .then(res => console.log(res));
    }
    buttonize("#list-databases", listDatabases)

    async function listStores() {
      console.log(await db.storeNames());
    }
    buttonize("#list-stores", listStores)

    async function addTodo(ev) {
      const formData = new FormData(ev.target);
      const entry = Object.fromEntries(formData.entries())["todo-input"];
      const store = await db.store("todo");
      store.add({task: entry});
      ev.preventDefault();
    }
    document.querySelector("#todo-form").addEventListener("submit", addTodo)

    async function logTodos(ev) {
      console.log(await db.store("todo").cursor().collect());
    }
    buttonize("#log-todos", logTodos);

    // Utilities

    function buttonize(id, fn) {
      document.querySelector(id).addEventListener("click", fn);
    }
  </script>
</html>
