<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  </head>
  <style>
    /* reset */
    html {
      box-sizing: border-box;
    }
    body, h1, h2, p, ol, ul {
      margin: 0;
      padding: 0;
      font-weight: normal;
    }
    ol, ul {
      list-style: none;
    }

    /* Styles */
    #header {
      display: flex;
      color: dodgerblue;
      flex-direction: column;
      align-items: center;
      margin: 24px 0px 24px;

      form {
        margin-top: 12px;
      }
    }

    #all-todos {
      display: flex;
      flex-direction: row;
      justify-content: space-around;

      @media (width < 800px) {
        flex-direction: column;
        align-items: center;
        gap: 30px;
      }
    }

    .category {
      color: dodgerblue;
      border: 1px solid dodgerblue;
      border-radius: 4px;
      width: 30%;
      min-height: 6rem;

      h2 {
        text-align: center;
        border-bottom: 1px solid dodgerblue;
        margin-bottom: 8px;
      }

      @media (width < 800px) {
        width: 90%;
      }
    }

    .todo {
      color: black;
      border: 1px solid dodgerblue;
      border-radius: 12px;
      margin: 8px;
      padding: 8px;
      display: flex;
      align-items: center;
      gap: 4px;

      div {
        flex-grow: 1;
      }

      button {
        background: none;
        border: none;
        font-size: 1.2rem;
      }
    }
  </style>
  <body>
    <div id="header">
      <h1>Todo App Browser Test</h1>
      <form id="new-todo-form">
        <input name="new-todo" type="text" value=""/>
        <button action="submit">Add Todo</button>
      </form>
    </div>
    <div id="all-todos">
      <div class="category">
        <h2>Todo</h2>
        <ul id="todo"></ul>
      </div>
      <div class="category">
        <h2>Done</h2>
        <ul id="done"></ul>
      </div>
      <div class="category">
        <h2>Discarded</h2>
        <ul id="discarded"></ul>
      </div>
    </div>
  </body>
  <script type="module">
    import { Database } from "../src/index.js";

    const db = new Database('todos', {
      1: (db) => {
        const todos = db.createObjectStore(
          "todos", { autoIncrement: true, keyPath: "id" }
        );
        todos.createIndex("text", "text");
        todos.createIndex("state", "state");
        todos.createIndex("created", "created");
        todos.createIndex("closed", "closed");
      }
    });

    function triggerRedisplay(el) {
      const ev = new Event("redisplay", { bubbles: true });
      el.dispatchEvent(ev);
    }

    function addTodo(ev) {
      ev.preventDefault();
      const form = new FormData(ev.target);
      const text = form.get("new-todo");
      db.store("todos").add({
        text: text,
        state: "todo",
        created: new Date(),
        closed: undefined,
      });
      triggerRedisplay(ev.target);
    }

    async function displayTodos(ev) {
      const todoNode = document.querySelector("#todo");
      const doneNode = document.querySelector("#done");
      const discardedNode = document.querySelector("#discarded");

      const todos = await db
        .store("todos").index("state").cursor("todo").collect();
      const dones = await db
        .store("todos").index("state").cursor("done").collect();
      const discarded = await db
        .store("todos").index("state").cursor("discarded").collect();

      todoNode.replaceChildren(...todos.map(t => todoElem(t)));
      doneNode.replaceChildren(...dones.map(t => todoElem(t)));
      discardedNode.replaceChildren(...discarded.map(t => todoElem(t)));
    }

    function todoElem(todo) {
      const key = todo.primaryKey;

      const setTodoState = (newState) => {
        db.store("todos").cursor(key).performUpdate(({value}) => {
          value.state = newState;
          return value;
        });
      }

      const doneListener = (ev) => {
        setTodoState("done");
        triggerRedisplay(document);
      };
      const discardListener = (ev) => {
        setTodoState("discarded");
        triggerRedisplay(document);
      };
      const refreshListener = (ev) => {
        setTodoState("todo");
        triggerRedisplay(document);
      };
      const deleteListener = (ev) => {
        db.store("todos").delete(key);
        triggerRedisplay(document);
      };

      const li = document.createElement("li");
      li.classList.add("todo")
      const div = document.createElement("div");
      const txt = document.createTextNode(todo.value.text);
      li.todoData = todo;
      li.appendChild(div);
      div.appendChild(txt);

      if (todo.value.state === "todo") {
        const doneBtn = elem("button", "✅", [], {click: doneListener});
        const discardBtn = elem("button", "❌", [], {click: discardListener});
        li.appendChild(doneBtn);
        li.appendChild(discardBtn);
      } else if (todo.value.state === "done") {
        const refreshBtn = elem("button", "↩️️", [], {click: refreshListener});
        const deleteBtn = elem("button", "🗑️", [], {click: deleteListener});
        li.appendChild(refreshBtn);
        li.appendChild(deleteBtn);
      } else if (todo.value.state === "discarded") {
        const refreshBtn = elem("button", "↩️", [], {click: refreshListener});
        const deleteBtn = elem("button", "🗑️", [], {click: deleteListener});
        li.appendChild(refreshBtn);
        li.appendChild(deleteBtn);
      } else {
        console.log(`Invalid todo state: ${todo.value.state}`);
      }
      return li
    }

    function elem(nodeType, text, children, listeners) {
      const node = document.createElement(nodeType);
      if (text !== undefined) {
        node.appendChild(document.createTextNode(text));
      }
      for (const child of children) {
        node.appendChild(child);
      }
      for (const [eventType, listener] of Object.entries(listeners)) {
        node.addEventListener(eventType, listener);
      }
      return node;
    }

    window.onload = () => {
      document
        .querySelector("#new-todo-form")
        .addEventListener("submit", addTodo);

      document
        .addEventListener("redisplay", displayTodos);

      displayTodos();
    }
  </script>
</html>
